<div
  class="group flex flex-col sm:flex-row sm:items-center justify-between gap-3 sm:gap-4 p-4 sm:p-5 bg-[#1A1A1A] rounded-2xl border border-white/10 hover:border-[#FFB300]/40 shadow-sm transition-all"
  [class.opacity-60]="category().visible === false"
>
  <!-- SECCIÓN PRINCIPAL: Drag Handle + Inputs Editables -->
  <div class="flex items-start gap-3.5 flex-1 min-w-0">
    <!-- DRAG HANDLE (44x44px Touch Target) -->
    <div
      cdkDragHandle
      class="w-11 h-11 rounded-xl bg-white/[0.04] hover:bg-white/[0.08] border border-white/10 flex items-center justify-center cursor-grab active:cursor-grabbing text-zinc-400 hover:text-[#FFB300] transition active:scale-95 shrink-0 select-none"
      title="Arrastrar para reordenar"
    >
      <lucide-icon name="grip-vertical" class="w-5 h-5"></lucide-icon>
    </div>

    <!-- CONTENT: Nombre, Descripción y Contador -->
    <div class="flex-1 min-w-0 space-y-1.5">
      <!-- Input Nombre Editable -->
      <input
        type="text"
        [value]="category().nombre"
        (change)="nameChanged.emit($any($event.target).value)"
        placeholder="Nombre de categoría"
        class="w-full bg-transparent text-base sm:text-lg font-bold text-white placeholder-zinc-500 border-b border-transparent focus:border-[#FFB300] focus:outline-none transition py-0.5"
      />

      <!-- Input Descripción Editable -->
      <div class="flex items-center gap-2 w-full">
        <lucide-icon name="file-text" class="w-3.5 h-3.5 text-zinc-500 shrink-0" />
        <input
          type="text"
          [value]="category().descripcion || ''"
          (change)="descriptionChanged.emit($any($event.target).value)"
          placeholder="Añadir descripción..."
          class="w-full bg-transparent text-xs sm:text-sm text-zinc-300 placeholder-zinc-500 border-b border-transparent focus:border-[#FFB300] focus:outline-none transition py-0.5"
        />
      </div>

      <!-- Metadatos y Feedback de Guardado -->
      <div class="flex items-center gap-3 pt-0.5">
        <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-md bg-white/[0.04] border border-white/10 text-xs font-semibold text-zinc-400 tabular-nums">
          {{ category().products_count || 0 }} productos
        </span>

        @if (isUpdating()) {
          <span class="text-[#FFB300] text-xs font-bold flex items-center gap-1.5 animate-pulse">
            <lucide-icon name="loader-2" class="w-3.5 h-3.5 animate-spin" />
            Guardando...
          </span>
        }
      </div>
    </div>
  </div>

  <!-- DIVISOR EN MÓVIL (<640px) -->
  <div class="block sm:hidden border-t border-white/10 my-0.5 w-full"></div>

  <!-- ACTIONS (44px Touch Targets, fila inferior en móvil, inline en desktop) -->
  <div class="flex items-center justify-between sm:justify-end gap-2 w-full sm:w-auto pt-1 sm:pt-0 opacity-100 sm:opacity-85 sm:group-hover:opacity-100 transition-opacity">
    <!-- Botón Agregar Producto -->
    <button
      (click)="addProduct.emit()"
      class="h-11 px-3.5 rounded-xl bg-[#FFB300]/10 hover:bg-[#FFB300]/20 active:bg-[#FFB300]/30 text-[#FFB300] border border-[#FFB300]/20 text-xs font-bold inline-flex items-center justify-center gap-2 transition active:scale-95 cursor-pointer select-none flex-1 sm:flex-initial"
      title="Agregar producto a esta categoría"
    >
      <lucide-icon name="plus-circle" class="w-4 h-4 text-[#FFB300]" />
      <span>+ Producto</span>
    </button>

    <!-- Botón Mostrar / Ocultar -->
    <button
      (click)="toggleVisibility.emit()"
      class="h-11 px-3.5 rounded-xl bg-white/[0.04] hover:bg-white/[0.08] active:bg-white/[0.12] text-zinc-300 hover:text-white border border-white/10 text-xs font-bold inline-flex items-center justify-center gap-2 transition active:scale-95 cursor-pointer select-none flex-1 sm:flex-initial"
      [title]="category().visible === false ? 'Mostrar categoría' : 'Ocultar categoría'"
    >
      <lucide-icon
        [name]="category().visible === false ? 'eye-off' : 'eye'"
        class="w-4 h-4 text-zinc-300"
      />
      <span>{{ category().visible === false ? 'Mostrar' : 'Ocultar' }}</span>
    </button>

    <!-- Botón Eliminar -->
    <button
      (click)="delete.emit()"
      class="w-11 h-11 rounded-xl bg-red-500/10 hover:bg-red-500/20 active:bg-red-500/30 text-red-400 border border-red-500/20 flex items-center justify-center transition active:scale-95 cursor-pointer select-none shrink-0"
      title="Eliminar categoría"
    >
      <lucide-icon name="trash-2" class="w-4 h-4 text-red-400" />
    </button>
  </div>
</div>
