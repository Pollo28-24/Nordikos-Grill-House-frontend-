<div class="p-3.5 sm:p-4 border-t border-white/10 bg-[#141416] shrink-0 pb-[calc(0.75rem+env(safe-area-inset-bottom,0px))]">
  <!-- Alerta de Validación de Modificadores / Variantes -->
  @if (!canAddToOrder() && blockingReason()) {
    <div class="mb-3 px-3 py-2 rounded-xl bg-amber-500/10 border border-amber-500/20 text-[#FFB300] text-xs font-semibold flex items-center gap-2 animate-in fade-in duration-200">
      <lucide-icon name="alert-circle" class="w-4 h-4 shrink-0 text-[#FFB300]" />
      <span class="truncate">{{ blockingReason() }}</span>
    </div>
  }

  <div class="flex items-center justify-between gap-3">
    <!-- Precio en tiempo real con breakdown -->
    <div class="flex flex-col min-w-0">
      <div class="flex items-center gap-1.5 text-[10px] text-zinc-400 font-medium leading-none mb-1">
        <span>Base: ${{ baseTotal() | number:'1.2-2' }}</span>
        @if (extrasTotal() > 0) {
          <span class="text-zinc-600">•</span>
          <span class="text-emerald-400 font-bold">+Extras: ${{ extrasTotal() | number:'1.2-2' }}</span>
        }
      </div>
      <div class="flex items-baseline gap-1">
        <span class="text-[10px] font-black text-zinc-500 uppercase tracking-wider">Total:</span>
        <span class="text-xl sm:text-2xl font-black text-[#FFB300] tabular-nums tracking-tight">
          ${{ liveTotal() | number:'1.2-2' }}
        </span>
      </div>
    </div>

    <!-- Botón CTA semántico -->
    <button 
      (click)="confirm.emit()"
      [disabled]="!canAddToOrder()"
      class="h-12 px-5 sm:px-7 rounded-xl bg-[#FFB300] text-zinc-950 font-black text-xs sm:text-sm uppercase tracking-wider hover:brightness-110 active:scale-95 disabled:bg-zinc-800 disabled:text-zinc-600 disabled:shadow-none transition-all shadow-lg shadow-[#FFB300]/10 flex items-center justify-center gap-2 cursor-pointer select-none shrink-0"
    >
      @if (!canAddToOrder()) {
        <lucide-icon name="alert-circle" class="w-4 h-4 text-zinc-500" />
        <span>FALTAN OPCIONES</span>
      } @else {
        <lucide-icon name="shopping-cart" class="w-4 h-4 text-zinc-950" />
        <span>{{ editingOrderId() ? 'AGREGAR A ORDEN #' + editingOrderId() : 'AGREGAR AL CARRITO' }}</span>
      }
    </button>
  </div>
</div>
