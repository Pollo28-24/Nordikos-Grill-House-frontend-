<div class="min-h-screen bg-nord-surface text-nord-text">
  <app-navbar />

  <main class="max-w-7xl mx-auto px-4 py-6 space-y-8 pb-[max(6rem,env(safe-area-inset-bottom))]">
    
    <!-- ============================= -->
    <!-- BUSCADOR DE PRODUCTOS -->
    <!-- ============================= -->
    <div class="relative w-full max-w-md">
      <div class="flex items-center gap-3 bg-zinc-900 border border-white/5 px-4 py-2.5 rounded-2xl focus-within:border-amber-500 transition duration-200 shadow-sm">
        <lucide-icon name="search" class="w-4 h-4 text-zinc-500 shrink-0"></lucide-icon>
        <input 
          type="text" 
          [value]="searchQuery()"
          (input)="onSearchQueryInput($event)"
          placeholder="Buscar producto por nombre..."
          class="w-full bg-transparent outline-none text-sm text-white placeholder-zinc-500"
        />
        @if (searchQuery()) {
          <button (click)="clearSearchQuery()" class="p-1 rounded-full hover:bg-white/5 transition text-zinc-400 hover:text-white" title="Limpiar búsqueda">
            <lucide-icon name="x" class="w-3.5 h-3.5"></lucide-icon>
          </button>
        }
      </div>
    </div>

    <!-- ============================= -->
    <!-- CATEGORY FILTER -->
    <!-- ============================= -->
    <section
      #categoryScroller
      class="relative flex gap-2 overflow-x-auto scrollbar-hide pb-1"
    >
      <!-- Todas -->
      <button
        class="px-4 py-2 rounded-full text-sm font-medium transition whitespace-nowrap shrink-0"
        [class.bg-nord-brand]="selectedCategoryId() === null"
        [class.text-nord-surface]="selectedCategoryId() === null"
        [class.bg-nord-card]="selectedCategoryId() !== null"
        [class.text-nord-text]="selectedCategoryId() !== null"
        (click)="showAllCategories()"
      >
        Todas las categorías
      </button>

      @for (category of categories(); track category.id) {
        <button
          class="px-4 py-2 rounded-full text-sm font-medium transition whitespace-nowrap shrink-0"
          [class.bg-nord-brand]="selectedCategoryId() === category.id"
          [class.text-nord-surface]="selectedCategoryId() === category.id"
          [class.bg-nord-card]="selectedCategoryId() !== category.id"
          [class.text-nord-text]="selectedCategoryId() !== category.id"
          (click)="filterProductsByCategory(category.id)"
        >
          {{ categoryNameOverrides()[category.id] || category.nombre }}
        </button>
      }

      <!-- Fade scroll -->
      <div class="pointer-events-none absolute right-0 top-0 h-full w-12 bg-linear-to-l from-nord-surface"></div>
    </section>

    <!-- ============================= -->
    <!-- GROUPED PRODUCTS -->
    <!-- ============================= -->
    @for (group of groupedProducts(); track group.categoryId) {
      <app-product-group-card
        [group]="group"
        [displayName]="group.displayName"
        [editingCategoryId]="editingCategoryId()"
        [editingCategoryName]="editingCategoryName()"
        (addProduct)="addProductToCategory($event)"
        (toggleVisibility)="toggleVisibility($event)"
        (startEditingCategory)="startEditingCategory($event.id, $event.name)"
        (cancelEditingCategory)="cancelEditingCategory()"
        (updateCategoryNameInput)="onEditingCategoryNameInput($event)"
        (saveCategoryName)="saveCategoryName($event.id, $event.originalName)"
        (editProduct)="editProduct($event)"
        (deleteProduct)="deleteProduct($event)"
      />
    }
  </main>
</div>
