<section id="galeria" class="py-8 sm:py-10 md:py-12 bg-nord-dark text-nord-cream border-t border-nord-border">
  <div class="max-w-6xl mx-auto px-4 sm:px-6">
    
    <!-- Header -->
    <div appRevealOnScroll class="reveal-init text-center max-w-xl mx-auto mb-4 sm:mb-6">
      <div class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full bg-nord-charcoal border border-nord-gold/30 text-nord-gold text-[9px] sm:text-[10px] font-semibold uppercase tracking-[0.2em] mb-1.5">
        <span>📸</span>
        <span>ANTOJO VISUAL</span>
      </div>
      <h2 class="font-serif text-xl sm:text-2xl md:text-3xl font-bold mb-2 text-nord-cream leading-tight">
        Galería <span class="text-nord-fire text-glow-gold">Gastronómica</span>
      </h2>
      <div class="h-0.5 w-12 bg-nord-fire mx-auto mb-2 sm:mb-2.5 rounded-full shadow-[0_0_8px_rgba(255,106,0,0.5)]"></div>
      <p class="font-sans text-xs sm:text-xs md:text-sm text-nord-cream-muted leading-relaxed">
        Una selección de nuestros platos y momentos preferidos alrededor de las brasas. Seleccioná cualquier foto para verla en detalle.
      </p>
    </div>

    <!-- Masonry-like Responsive Grid -->
    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 sm:gap-4 md:gap-5">
      @for (img of images; track img.url; let i = $index) {
        <div 
          appRevealOnScroll
          [revealDelay]="(i % 4) * 80"
          role="button"
          tabindex="0"
          [attr.aria-label]="'Ampliar fotografía de ' + img.title"
          (click)="onImageClick(i)"
          (keydown.enter)="onImageClick(i)"
          (keydown.space)="$event.preventDefault(); onImageClick(i)"
          class="reveal-scale relative group overflow-hidden rounded-xl bg-nord-charcoal aspect-square cursor-pointer border border-nord-border hover:border-nord-gold/50 active:scale-95 focus:outline-none focus:ring-2 focus:ring-nord-fire transition-all duration-300 shadow-md"
          [class.md:col-span-2]="i === 1 || i === 4 || i === 8"
        >
          <!-- Image -->
          <img 
            [src]="img.url" 
            [alt]="'Platillo ' + img.title + ' en Nórdicos Grill House'" 
            class="w-full h-full object-cover transition-transform duration-700 ease-out group-hover:scale-108"
            loading="lazy"
            decoding="async"
          />
          
          <!-- Hover / Focus Overlay -->
          <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/35 to-transparent opacity-0 group-hover:opacity-100 group-focus:opacity-100 transition-opacity duration-300 flex flex-col justify-end p-3 sm:p-5 z-10">
            <span class="text-nord-gold text-[10px] sm:text-xs uppercase tracking-wider font-semibold mb-0.5 sm:mb-1">{{ img.category }}</span>
            <h3 class="font-serif text-xs sm:text-base md:text-lg font-bold text-nord-cream transform translate-y-1 group-hover:translate-y-0 transition-transform duration-300 truncate">{{ img.title }}</h3>
          </div>
          
          <!-- Outer border decoration on hover -->
          <div class="absolute inset-2 sm:inset-3 border border-nord-gold/0 rounded-lg pointer-events-none transition-all duration-300 group-hover:border-nord-gold/40 z-20"></div>
        </div>
      }
    </div>

  </div>
</section>
