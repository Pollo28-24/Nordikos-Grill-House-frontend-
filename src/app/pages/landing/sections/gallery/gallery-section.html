<section class="py-16 sm:py-20 md:py-28 lg:py-32 bg-nord-dark text-nord-cream">
  <div class="max-w-6xl mx-auto px-4 sm:px-6">
    
    <!-- Header -->
    <div appRevealOnScroll class="reveal-init text-center max-w-2xl mx-auto mb-10 sm:mb-14 md:mb-16">
      <span class="text-nord-gold uppercase tracking-widest text-[11px] sm:text-xs font-semibold mb-2 sm:mb-3 block">Antojo Visual</span>
      <h2 class="font-serif text-2xl sm:text-4xl md:text-5xl font-bold mb-4 sm:mb-6 text-nord-cream">
        Galería <span class="text-nord-ember">Premium</span>
      </h2>
      <div class="h-0.5 w-14 sm:w-16 bg-nord-ember mx-auto mb-4 sm:mb-6 rounded-full"></div>
      <p class="font-sans text-xs sm:text-sm md:text-base text-nord-cream-muted leading-relaxed">
        Una selección de nuestros platos y momentos preferidos alrededor de las brasas. Tocá cualquier imagen para ampliarla.
      </p>
    </div>

    <!-- Masonry-like Responsive Grid (2 columns on mobile, 4 on desktop) -->
    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 sm:gap-4 md:gap-6">
      @for (img of images; track img.title; let i = $index) {
        <div 
          appRevealOnScroll
          [revealDelay]="(i % 4) * 80"
          (click)="onImageClick(i)"
          class="reveal-scale relative group overflow-hidden rounded-xl bg-nord-charcoal aspect-square cursor-pointer border border-nord-gold/10 hover:border-nord-gold/30 active:scale-95 transition-all duration-300 shadow-md"
          [class.md:col-span-2]="i === 1 || i === 4 || i === 8"
        >
          <!-- Image -->
          <img 
            [src]="img.url" 
            [alt]="img.title" 
            class="w-full h-full object-cover transition-transform duration-700 ease-out group-hover:scale-105"
            loading="lazy"
          />
          
          <!-- Hover / Focus Overlay -->
          <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/30 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex flex-col justify-end p-3 sm:p-5 z-10">
            <span class="text-nord-gold text-[10px] sm:text-xs uppercase tracking-wider font-semibold mb-0.5 sm:mb-1">{{ img.category }}</span>
            <h3 class="font-serif text-xs sm:text-base md:text-lg font-bold text-nord-cream transform translate-y-1 group-hover:translate-y-0 transition-transform duration-300 truncate">{{ img.title }}</h3>
          </div>
          
          <!-- Outer border decoration on hover -->
          <div class="absolute inset-2 sm:inset-3 border border-nord-gold/0 rounded-lg pointer-events-none transition-all duration-300 group-hover:border-nord-gold/30 z-20"></div>
        </div>
      }
    </div>

  </div>
</section>
