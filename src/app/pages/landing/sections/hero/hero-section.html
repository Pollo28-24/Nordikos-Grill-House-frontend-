<section class="relative min-h-[100dvh] w-full flex items-center justify-center overflow-hidden bg-nord-dark pt-24 pb-16 md:py-0">
  <!-- LAYER 1: Background (Video with Poster WebP Fallback, zero 404) -->
  <div class="absolute inset-0 z-0 overflow-hidden">
    <!-- Primary High-Res Poster -->
    <div 
      class="absolute inset-0 bg-cover bg-center bg-no-repeat transition-transform duration-1000 scale-105"
      style="background-image: url('assets/header/fondo.jpg'); filter: brightness(0.5) contrast(1.08);"
    ></div>

    <!-- Video Element (Optional stream, only rendered when valid URL exists) -->
    @if (heroVideoUrl()) {
      <video 
        autoplay 
        loop 
        muted 
        playsinline 
        preload="none"
        aria-hidden="true"
        poster="assets/header/fondo.jpg"
        class="absolute min-w-full min-h-full w-auto h-auto top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 object-cover transition-opacity duration-1000"
        style="filter: brightness(0.55);"
      >
        <source [src]="heroVideoUrl()!" type="video/mp4">
      </video>
    }
  </div>

  <!-- LAYER 2: Overlay (Directional Dark Fire Gradient for AAA contrast) -->
  <div class="absolute inset-0 z-10 pointer-events-none bg-gradient-to-t from-nord-dark via-nord-dark/75 to-nord-dark/60"></div>
  <div class="absolute inset-0 z-10 pointer-events-none" style="background: radial-gradient(circle at center, rgba(255,106,0,0.12) 0%, rgba(5,5,5,0.72) 75%);"></div>

  <!-- LAYER 3: Hero Content (Conversion-First Sensory Hierarchy) -->
  <div class="relative z-20 max-w-4xl mx-auto px-5 sm:px-6 text-center flex flex-col items-center justify-center">
    <!-- Floating Badge -->
    <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-nord-charcoal/90 border border-nord-gold/30 shadow-[0_0_15px_rgba(255,106,0,0.25)] text-nord-gold text-[10px] sm:text-xs font-semibold uppercase tracking-[0.25em] mb-4 sm:mb-5 animate-float">
      <span>🔥</span>
      <span>PARRILLA ARTESANAL • OAXACA</span>
    </div>

    <!-- H1 Title -->
    <h1 class="font-serif text-3xl sm:text-5xl md:text-6xl lg:text-7xl font-bold text-nord-cream tracking-tight leading-[1.12] mb-3 sm:mb-4 drop-shadow-[0_4px_16px_rgba(0,0,0,0.9)]">
      El sabor del fuego,<br class="hidden sm:inline"/>
      <span class="text-nord-fire text-glow-gold drop-shadow-[0_2px_12px_rgba(255,106,0,0.45)]">directo a tu mesa</span>
    </h1>

    <!-- Subtitle (SEO + Appetite) -->
    <p class="font-sans text-sm sm:text-base md:text-lg text-nord-cream-muted max-w-2xl mx-auto mb-2.5 sm:mb-3 tracking-wide font-normal leading-relaxed">
      Hamburguesas artesanales y cortes premium preparados con brasas reales en Oaxaca.
    </p>

    <!-- Micro-copy Storytelling -->
    <p class="font-serif italic text-xs sm:text-sm text-nord-gold/90 mb-6 sm:mb-7 font-medium tracking-wider">
      "Donde cada brasa cuenta una historia."
    </p>

    <!-- Action Buttons (Balanced size, comfortable touch targets) -->
    <div class="flex flex-col sm:flex-row gap-3 sm:gap-4 justify-center items-center w-full max-w-sm sm:max-w-md">
      <a 
        routerLink="/menu"
        class="w-full sm:w-auto min-h-[44px] px-6 sm:px-7 py-2.5 sm:py-3 bg-nord-fire hover:bg-nord-fire/90 text-nord-cream font-sans font-bold text-xs sm:text-sm uppercase tracking-wider rounded-xl shadow-[0_0_20px_rgba(255,106,0,0.4)] border border-nord-gold/30 hover:shadow-[0_0_30px_rgba(255,106,0,0.65)] transition-all duration-300 transform hover:-translate-y-0.5 active:scale-95 text-center flex items-center justify-center cursor-pointer animate-glow-pulse"
      >
        🔥 Ordenar Ahora
      </a>
      <a 
        href="#ubicacion"
        (click)="scrollToSection('ubicacion', $event)"
        class="w-full sm:w-auto min-h-[44px] px-6 sm:px-7 py-2.5 sm:py-3 bg-nord-charcoal/80 hover:bg-nord-charcoal text-nord-cream font-sans font-semibold text-xs sm:text-sm rounded-xl border border-nord-gold/30 hover:border-nord-gold/60 transition-all duration-300 transform hover:-translate-y-0.5 active:scale-95 text-center flex items-center justify-center cursor-pointer backdrop-blur-md"
      >
        📍 Dónde encontrarnos
      </a>
    </div>
  </div>

  <!-- Scroll Down Indicator (pointing towards favorites) -->
  <div class="absolute bottom-3 sm:bottom-6 left-1/2 -translate-x-1/2 z-20 flex flex-col items-center gap-1">
    <span class="text-nord-cream/40 text-[10px] sm:text-xs tracking-widest uppercase font-light">Favoritos</span>
    <a 
      href="#destacados" 
      (click)="scrollToSection('destacados', $event)"
      class="text-nord-gold hover:text-nord-fire transition-colors duration-300 animate-bounce-down p-1 cursor-pointer"
      aria-label="Ir a favoritos"
    >
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 sm:w-6 sm:h-6">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
      </svg>
    </a>
  </div>
</section>
