<section 
  #statsContainer 
  class="relative py-16 bg-nord-dark border-y border-nord-gold/5 overflow-hidden"
>
  <!-- Decorative background elements -->
  <div class="absolute top-1/2 left-1/4 -translate-y-1/2 w-72 h-72 bg-nord-ember/5 rounded-full filter blur-3xl pointer-events-none"></div>
  <div class="absolute top-1/2 right-1/4 -translate-y-1/2 w-72 h-72 bg-nord-gold/5 rounded-full filter blur-3xl pointer-events-none"></div>

  <div class="max-w-6xl mx-auto px-6 relative z-10">
    <div class="grid grid-cols-2 md:grid-cols-4 gap-8 md:gap-4 text-center divide-y md:divide-y-0 md:divide-x divide-nord-gold/5">
      
      @for (stat of stats(); track stat.label; let i = $index) {
        <div class="flex flex-col items-center justify-center p-4" [class.pt-8]="i >= 2 && i < 4" [class.md:pt-4]="true">
          <!-- Stat Number -->
          <div class="font-serif text-4xl md:text-5xl lg:text-6xl font-extrabold text-nord-gold mb-2 tracking-tight text-glow-gold drop-shadow-[0_2px_10px_rgba(251,191,36,0.15)]">
            <span>{{ stat.prefix }}</span>{{ stat.current }}<span>{{ stat.suffix }}</span>
          </div>
          <!-- Stat Label -->
          <div class="font-sans text-xs md:text-sm text-nord-cream-muted uppercase tracking-widest font-medium">
            {{ stat.label }}
          </div>
        </div>
      }

    </div>
  </div>
</section>
