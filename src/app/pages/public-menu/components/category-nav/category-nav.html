<div class="flex overflow-x-auto gap-3 pb-1 hide-scrollbar">
  <button 
    (click)="onSelect.emit(null)"
    [class]="pillClass(selectedCategoryId() === null)"
    class="shrink-0 px-5 h-10 rounded-full text-sm font-bold transition-all duration-300 whitespace-nowrap active:scale-95 shadow-sm border"
  >
    Todos
  </button>

  @for (category of categories(); track category.id) {
    <button 
      (click)="onSelect.emit(category.id)"
      [class]="pillClass(isSelected(category.id))"
      class="shrink-0 px-5 h-10 rounded-full text-sm font-bold transition-all duration-300 whitespace-nowrap active:scale-95 shadow-sm border cursor-pointer"
    >
      {{ category.nombre }}
    </button>
  }
</div>
