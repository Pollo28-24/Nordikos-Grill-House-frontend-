@if (isOpen()) {
<div class="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 overflow-y-auto overscroll-contain">
  <!-- Backdrop -->
  <div class="fixed inset-0 bg-black/70 backdrop-blur-sm transition-opacity touch-none select-none" (click)="onClose()"></div>

  <!-- Modal Container -->
  <div class="relative w-full max-w-lg bg-[#F8F5EE] border border-[#E2D7B7] text-gray-900 rounded-3xl shadow-2xl overflow-hidden my-auto animate-in zoom-in-95 duration-200 z-10 flex flex-col max-h-[92vh] overscroll-contain">
    
    <!-- 1. Cabecera con Navegación de Pasos -->
    <app-checkout-header
      [step]="step()"
      (back)="onHeaderBack()"
      (close)="onClose()"
    ></app-checkout-header>

    <!-- 2. Acordeón Resumen del Pedido (Excepto en Pantalla de Éxito) -->
    @if (step() !== 'success') {
      <app-checkout-summary-accordion
        [items]="items()"
        [total]="total()"
        [isExpanded]="showOrderSummary()"
        (toggle)="toggleSummary()"
      ></app-checkout-summary-accordion>
    }

    <!-- 3. Cuerpo Scrolleable por Pasos -->
    <div class="p-5 overflow-y-auto flex-1 space-y-5 custom-scrollbar">
      @switch (step()) {
        @case ('service') {
          <app-checkout-service-step
            [serviceTypes]="serviceTypes()"
            [selectedServiceId]="selectedServiceId()"
            (selectService)="selectService($event)"
          ></app-checkout-service-step>
        }
        @case ('data') {
          <app-checkout-data-step
            [form]="checkoutForm"
            [serviceCode]="serviceCode()"
            [geoStatus]="geoStatus()"
            [capturedLocation]="capturedLocation()"
            [manualAddressMode]="manualAddressMode()"
            (requestLocation)="requestCurrentLocation()"
            (enableManualAddress)="manualAddressMode.set(true)"
            (openGoogleMaps)="openGoogleMaps()"
          ></app-checkout-data-step>
        }
        @case ('payment') {
          <app-checkout-payment-step
            [form]="checkoutForm"
            [total]="total()"
          ></app-checkout-payment-step>
        }
        @case ('success') {
          <app-checkout-success-step
            [requestCode]="successRequestCode()"
            [serviceCode]="serviceCode()"
            [order]="currentSubmittedOrder()"
            [total]="submittedTotal() > 0 ? submittedTotal() : total()"
            [whatsappUrl]="getWhatsAppShareUrl()"
            [ordersCount]="clientOrdersService.ordersCount()"
            (viewHistory)="openOrdersHistory.emit()"
            (newOrder)="startNewOrder()"
            (close)="onClose()"
          ></app-checkout-success-step>
        }
      }
    </div>

    <!-- 4. Barra Inferior de Navegación entre Pasos -->
    @if (step() !== 'success') {
      <div class="p-5 border-t border-[#E2D7B7]/60 bg-[#F4EEDC]/40 flex items-center gap-3 shrink-0">
        @if (step() === 'service') {
          <button 
            type="button" 
            (click)="onClose()" 
            class="flex-1 h-12 rounded-xl border border-gray-300 text-gray-700 text-xs font-bold hover:bg-white active:scale-95 transition cursor-pointer"
          >
            Seguir Comprando
          </button>
        }

        @if (step() === 'data') {
          <button 
            type="button" 
            (click)="goToStep('service')" 
            class="h-12 px-4 rounded-xl border border-gray-300 text-gray-700 text-xs font-bold hover:bg-white active:scale-95 transition cursor-pointer"
          >
            Atrás
          </button>
          <button 
            type="button" 
            (click)="goToPaymentStep()" 
            class="flex-1 h-12 rounded-xl bg-zinc-900 hover:bg-zinc-800 text-white text-xs font-bold flex items-center justify-center gap-2 active:scale-95 transition shadow-md cursor-pointer"
          >
            <span>Continuar al Pago</span>
            <lucide-icon name="chevron-right" class="h-4 w-4"></lucide-icon>
          </button>
        }

        @if (step() === 'payment') {
          <button 
            type="button" 
            (click)="goToStep('data')" 
            class="h-12 px-4 rounded-xl border border-gray-300 text-gray-700 text-xs font-bold hover:bg-white active:scale-95 transition cursor-pointer"
          >
            Atrás
          </button>
          <button 
            type="button" 
            (click)="submitOrder()"
            [disabled]="isSubmitting()"
            class="flex-1 h-12 rounded-xl bg-orange-500 hover:bg-orange-600 disabled:bg-orange-300 text-white text-xs font-bold flex items-center justify-center gap-2 shadow-lg shadow-orange-500/25 active:scale-95 transition cursor-pointer"
          >
            @if (isSubmitting()) {
              <lucide-icon name="loader" class="h-4 w-4 animate-spin"></lucide-icon>
              <span>Enviando Comanda...</span>
            } @else {
              <lucide-icon name="send" class="h-4 w-4"></lucide-icon>
              <span>Confirmar y Enviar Pedido ({{ total() | currencyMxn }})</span>
            }
          </button>
        }
      </div>
    }

  </div>
</div>
}
