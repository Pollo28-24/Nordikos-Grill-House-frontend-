<div class="fixed inset-0 z-[60] flex items-end sm:items-center justify-center p-0 sm:p-4 overscroll-contain">
  <!-- Backdrop con aislamiento total de scroll y touch-none -->
  <div 
    (click)="requestClose()" 
    class="absolute inset-0 bg-black/60 backdrop-blur-sm transition-opacity touch-none select-none"
  ></div>

  <!-- Content Container (Bottom Sheet en móvil / Modal centrado en Desktop) -->
  <div class="relative w-full max-w-lg bg-[#F8F5EE] rounded-t-3xl sm:rounded-3xl overflow-hidden shadow-2xl animate-slide-up sm:animate-fade-in flex flex-col h-[92vh] max-h-[94vh] sm:max-h-[88vh] z-10 border border-[#E2D7B7]/80 overscroll-contain">
    
    <!-- Drag handle pill indicator (Mobile only) -->
    <div class="sm:hidden absolute top-2.5 left-1/2 -translate-x-1/2 w-10 h-1 rounded-full bg-white/70 shadow-sm z-30 pointer-events-none"></div>

    <!-- 1. Cabecera Visual (Hero Image, Cierre, Título y Resumen Base) -->
    <app-modal-hero-header class="block shrink-0" (onClose)="requestClose()"></app-modal-hero-header>

    <!-- 2. Barra Superior de Pestañas de Secciones (Sticky Nav Pills) -->
    <app-section-tabs-nav class="block shrink-0" (onSelectSection)="handleSectionSelect($event)"></app-section-tabs-nav>

    <!-- 3. Carrusel Horizontal Paginado (Scroll-Snap X + IntersectionObserver) -->
    <app-section-carousel class="flex-1 min-h-0 flex flex-col overflow-hidden"></app-section-carousel>

    <!-- 4. Footer de Acción Fijo (Precio Desglosado y Botón de Confirmación) -->
    <app-modal-footer-action 
      class="block shrink-0"
      [isAdded]="isAdded()" 
      (onAddToCart)="handleAdd()"
    ></app-modal-footer-action>

  </div>
</div>
