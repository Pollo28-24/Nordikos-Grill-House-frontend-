<header class="sticky top-0 z-40 backdrop-blur-md border-b" [class]="headerTheme()">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 sm:py-4 flex flex-col gap-3 sm:gap-4">
    
    <!-- TOP ROW: Logo, Search (Desktop), Cart -->
    <div class="flex items-center justify-between gap-4">
      
      <div class="flex items-center gap-2 sm:gap-4 shrink-0">
        <!-- Back to Landing -->
        <a routerLink="/landing" class="p-2 -ml-2 rounded-full transition-all flex items-center justify-center shrink-0" [class]="iconLinkTheme()" title="Volver al inicio">
          <lucide-icon name="home" class="h-5 w-5"></lucide-icon>
        </a>

        <!-- Go to System Home (only for authenticated users) -->
        @if (isAuthenticated) {
          <a routerLink="/home" class="p-2 rounded-full transition-all flex items-center justify-center shrink-0" [class]="iconLinkTheme()" title="Ir al sistema">
            <lucide-icon name="settings" class="h-5 w-5"></lucide-icon>
          </a>
        }
        
        <!-- Logo -->
        <a routerLink="/landing" class="flex items-center gap-2 shrink-0 cursor-pointer hover:opacity-80 transition-opacity">
          <img src="assets/logo/logo 2 nordicos.jpg" alt="Nordicos Logo" class="h-9 sm:h-11 w-9 sm:w-11 object-cover rounded-full drop-shadow-sm border" [class]="logoTheme()">
          <h1 class="text-base sm:text-lg font-black tracking-tight hidden sm:block" [class]="titleTheme()">Nordicos</h1>
        </a>
      </div>
      
      <!-- SEARCH (Desktop) -->
      <div class="hidden md:block relative flex-1 max-w-xl mx-auto">
        <span class="absolute inset-y-0 left-0 pl-4 flex items-center" [class]="searchIconTheme()">
          <lucide-icon name="search" class="h-4 w-4"></lucide-icon>
        </span>
        <input 
          type="text" 
          placeholder="¿Qué se te antoja hoy?"
          [value]="searchQuery()"
          (input)="handleSearch($event)"
          class="w-full pl-11 pr-4 h-11 border rounded-full text-sm font-medium outline-none transition-all focus:ring-2 focus:ring-orange-500 shadow-sm"
          [class]="searchTheme()"
        >
      </div>

      <!-- CART TOGGLE -->
      <div class="flex items-center gap-2">
        <button 
          (click)="onCartClick.emit()"
          class="relative p-2.5 border rounded-full shadow-sm hover:shadow-md transition-all active:scale-95 shrink-0"
          [class]="cartTheme()"
          [class.animate-bump]="cartBumping()"
        >
          <lucide-icon name="shopping-cart" class="h-5 w-5"></lucide-icon>
          @if (cartCount() > 0) {
            <span class="absolute -top-1 -right-1 bg-orange-500 text-white text-[10px] font-black h-5 w-5 flex items-center justify-center rounded-full shadow-sm border-2" [class]="badgeBorderTheme()">
              {{ cartCount() }}
            </span>
          }
        </button>
      </div>
    </div>

    <!-- SEARCH (Mobile) -->
    <div class="relative md:hidden w-full">
      <span class="absolute inset-y-0 left-0 pl-4 flex items-center" [class]="searchIconTheme()">
        <lucide-icon name="search" class="h-4 w-4"></lucide-icon>
      </span>
      <input 
        type="text" 
        placeholder="¿Qué se te antoja hoy?"
        [value]="searchQuery()"
        (input)="handleSearch($event)"
        class="w-full pl-11 pr-4 h-11 border rounded-full text-sm font-medium outline-none transition-all focus:ring-2 focus:ring-orange-500 shadow-sm"
        [class]="searchTheme()"
      >
    </div>
  </div>
</header>
