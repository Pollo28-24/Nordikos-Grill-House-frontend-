<div class="min-h-screen bg-[#121212] text-[#F5F5F5] pb-24 overflow-x-hidden w-full">
  
  <!-- Encabezado y Filtros -->
  <header class="bg-[#1C1C1C]/85 backdrop-blur-md border-b border-white/5 sticky top-0 z-30 shadow-2xl">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
      
      <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-6">
        
        <!-- Izquierda: Título y Regresar -->
        <div class="flex items-center gap-3 shrink-0">
          <button (click)="goBack()" class="w-9 h-9 flex items-center justify-center rounded-lg bg-white/5 border border-white/5 hover:bg-white/10 text-zinc-300 hover:text-[#FFB300] hover:border-[#FFB300]/20 transition-all active:scale-95 cursor-pointer" title="Volver">
            <lucide-icon name="chevron-left" class="w-5 h-5"></lucide-icon>
          </button>
          <div>
            <h1 class="text-xl sm:text-2xl font-black text-white flex items-center gap-2 tracking-tight">
              <lucide-icon name="trending-up" class="w-5 h-5 sm:w-6 sm:h-6 text-[#FFB300]"></lucide-icon>
              Panel de Ventas
            </h1>
            <p class="text-[11px] sm:text-xs text-[#888] font-medium mt-0.5">Analiza los ingresos y el rendimiento de tu negocio.</p>
          </div>
        </div>

        <!-- Derecha: Filtros -->
        <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3 w-full lg:w-auto">
          <!-- Selector segmentado -->
          <div class="flex items-center bg-white/[0.02] p-1 rounded-xl border border-white/5 overflow-x-auto w-full sm:w-auto">
            <button 
              (click)="setRange('all')"
              class="flex-1 sm:flex-initial px-4 py-2 rounded-lg text-xs font-bold uppercase tracking-wider transition whitespace-nowrap cursor-pointer"
              [class.bg-[#FFB300]]="selectedDateRange() === 'all'"
              [class.text-[#121212]]="selectedDateRange() === 'all'"
              [class.shadow-md]="selectedDateRange() === 'all'"
              [class.shadow-amber-500/10]="selectedDateRange() === 'all'"
              [class.text-zinc-400]="selectedDateRange() !== 'all'"
              [class.hover:text-white]="selectedDateRange() !== 'all'">
              Todos
            </button>
            <button 
              (click)="setRange('today')"
              class="flex-1 sm:flex-initial px-4 py-2 rounded-lg text-xs font-bold uppercase tracking-wider transition whitespace-nowrap cursor-pointer"
              [class.bg-[#FFB300]]="selectedDateRange() === 'today'"
              [class.text-[#121212]]="selectedDateRange() === 'today'"
              [class.shadow-md]="selectedDateRange() === 'today'"
              [class.shadow-amber-500/10]="selectedDateRange() === 'today'"
              [class.text-zinc-400]="selectedDateRange() !== 'today'"
              [class.hover:text-white]="selectedDateRange() !== 'today'">
              Hoy
            </button>
            <button 
              (click)="setRange('week')"
              class="flex-1 sm:flex-initial px-4 py-2 rounded-lg text-xs font-bold uppercase tracking-wider transition whitespace-nowrap cursor-pointer"
              [class.bg-[#FFB300]]="selectedDateRange() === 'week'"
              [class.text-[#121212]]="selectedDateRange() === 'week'"
              [class.shadow-md]="selectedDateRange() === 'week'"
              [class.shadow-amber-500/10]="selectedDateRange() === 'week'"
              [class.text-zinc-400]="selectedDateRange() !== 'week'"
              [class.hover:text-white]="selectedDateRange() !== 'week'">
              Esta Semana
            </button>
            <button 
              (click)="setRange('month')"
              class="flex-1 sm:flex-initial px-4 py-2 rounded-lg text-xs font-bold uppercase tracking-wider transition whitespace-nowrap cursor-pointer"
              [class.bg-[#FFB300]]="selectedDateRange() === 'month'"
              [class.text-[#121212]]="selectedDateRange() === 'month'"
              [class.shadow-md]="selectedDateRange() === 'month'"
              [class.shadow-amber-500/10]="selectedDateRange() === 'month'"
              [class.text-zinc-400]="selectedDateRange() !== 'month'"
              [class.hover:text-white]="selectedDateRange() !== 'month'">
              Este Mes
            </button>
            <button 
              (click)="setRange('custom')"
              class="flex-1 sm:flex-initial px-4 py-2 rounded-lg text-xs font-bold uppercase tracking-wider transition whitespace-nowrap cursor-pointer"
              [class.bg-[#FFB300]]="selectedDateRange() === 'custom'"
              [class.text-[#121212]]="selectedDateRange() === 'custom'"
              [class.shadow-md]="selectedDateRange() === 'custom'"
              [class.shadow-amber-500/10]="selectedDateRange() === 'custom'"
              [class.text-zinc-400]="selectedDateRange() !== 'custom'"
              [class.hover:text-white]="selectedDateRange() !== 'custom'">
              Personalizado
            </button>
          </div>
 
          @if (selectedDateRange() === 'custom') {
            <div class="flex items-center gap-2 animate-in fade-in slide-in-from-top-1 bg-white/[0.02] p-1.5 rounded-xl border border-white/5 w-full sm:w-auto justify-between sm:justify-start">
              <input type="date" [(ngModel)]="customStartDate" (change)="applyCustomDate()" class="bg-black/30 border border-white/10 text-white text-xs font-semibold rounded-lg px-3 py-1.5 focus:outline-none focus:border-amber-500/50 transition">
              <span class="text-zinc-500 text-xs font-bold">-</span>
              <input type="date" [(ngModel)]="customEndDate" (change)="applyCustomDate()" class="bg-black/30 border border-white/10 text-white text-xs font-semibold rounded-lg px-3 py-1.5 focus:outline-none focus:border-amber-500/50 transition">
            </div>
          }
        </div>
 
      </div>
    </div>
  </header>
 
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8 w-full box-border">
    
    @if (loading()) {
      <div class="flex flex-col items-center justify-center py-24 gap-4">
        <lucide-icon name="loader-2" class="w-10 h-10 text-[#FFB300] animate-spin"></lucide-icon>
        <p class="text-zinc-500 font-medium">Calculando métricas...</p>
      </div>
    } @else {
      <!-- KPIs -->
      <app-sales-kpis 
        [totalRevenue]="totalRevenue()" 
        [totalOrdersCount]="totalOrdersCount()" 
        [averageTicket]="averageTicket()"
      />
 
      <!-- Desglose por Servicio -->
      <app-sales-breakdown 
        [breakdown]="serviceBreakdown()"
      />
 
      <!-- Tabla de Transacciones -->
      <app-sales-transactions 
        [orders]="filteredOrders()" 
        [selectedServiceType]="selectedServiceType()"
        (serviceTypeChange)="setServiceType($event)"
      />
    }
 
  </main>
</div>
